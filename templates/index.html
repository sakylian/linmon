<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0d1117;color:#c9d1d9;font-size:14px}
.header{background:#161b22;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #30363d}

.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap}

.toolbar .right{display:flex;gap:8px;align-items:center}

th.sort-arrow::after{content:'\25B2';font-size:10px;margin-left:4px;color:#58a6ff}
th.sort-arrow.desc::after{content:'\25BC';font-size:10px;margin-left:4px;color:#58a6ff}

<div class="header">
  <h1>linmon — Linux 进程与网络安全监控</h1>

<script>
const API = '';
let refreshTimers = {proc: null, net: null};

// ====== 排序状态管理 ======
let procSort = {key: null, order: 'asc'};
let netSort = {key: null, order: 'asc'};
let _lastProcData = null;
let _lastConnData = null;

// 进程表列定义: 表头显示名 → 对应数据字段
const PROC_COLUMNS = [
  {label:'PID', key:'pid', type:'number'},
  {label:'进程名', key:'name', type:'string'},
  {label:'用户', key:'username', type:'string'},
  {label:'启动时间', key:'start_time', type:'string'},
  {label:'运行时长', key:'uptime', type:'number'},
  {label:'内存', key:'memory_rss', type:'number'},
  {label:'说明', key:'description', type:'string'},
  {label:'网络', key:'net_conns_str', type:'string'},
  {label:'定时', key:'has_schedule', type:'number'},
  {label:'风险', key:'risk_level', type:'risk'},
];

// 网络连接表列定义
const NET_COLUMNS = [
  {label:'协议', key:'protocol', type:'string'},
  {label:'状态', key:'state', type:'string'},
  {label:'方向', key:'direction', type:'string'},
  {label:'本地地址', key:'local_port', type:'number'},
  {label:'远程地址', key:'remote_port', type:'number'},
  {label:'数据类型', key:'data_type', type:'string'},
  {label:'归属地', key:'geo', type:'geo'},
  {label:'对端OS', key:'remote_os', type:'string'},
  {label:'进程', key:'process', type:'string'},
  {label:'时长', key:'age_seconds', type:'number'},
  {label:'发送', key:'bytes_sent', type:'number'},
  {label:'接收', key:'bytes_recv', type:'number'},
  {label:'频率', key:'frequency_desc', type:'string'},
  {label:'风险', key:'risk_level', type:'risk'},
];

function _getSortValue(item, col) {
  const v = item[col.key];
  if (col.type === 'risk') {
    const order = {high:0, medium:1, low:2};
    return order[v] ?? 3;
  }
  if (col.type === 'geo') {
    return (v && v.geo_str) ? v.geo_str : '';
  }
  if (col.type === 'number') {
    return (v === null || v === undefined) ? -Infinity : Number(v) || 0;
  }
  return (v === null || v === undefined) ? '' : String(v);
}

function _sortData(data, sort, columns) {
  if (!sort.key) return data;
  const col = columns.find(c => c.key === sort.key);
  if (!col) return data;
  const dir = sort.order === 'desc' ? -1 : 1;
  return [...data].sort((a, b) => {
    const va = _getSortValue(a, col);
    const vb = _getSortValue(b, col);
    if (va < vb) return -1 * dir;
    if (va > vb) return 1 * dir;
    return 0;
  });
}

function _handleSortClick(sortObj, columns, containerId, renderFn) {
  return function(key) {
    if (sortObj.key === key) {
      sortObj.order = sortObj.order === 'asc' ? 'desc' : 'asc';
    } else {
      sortObj.key = key;
      sortObj.order = 'asc';
    }
    // 更新表头箭头
    document.querySelectorAll('#' + containerId + ' th.sortable').forEach(th => {
      th.classList.remove('sort-arrow', 'desc');
    });
    const th = document.querySelector('#' + containerId + ` th[data-key="${key}"]`);
    if (th) {
      th.classList.add('sort-arrow');
      if (sortObj.order === 'desc') th.classList.add('desc');
    }
    renderFn();
  };
}

// ====== Markdown 渲染器 ======
function renderMarkdown(md) {
  if (!md) return '';
  // 1. 转义 HTML
  let html = md.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  // 2. 提取代码块（防止内部内容被其他规则处理）
  const codeBlocks = [];
  html = html.replace(/```([\s\S]*?)```/g, (m, code) => {
    const idx = codeBlocks.length;
    codeBlocks.push('<pre><code>' + code.replace(/^\n/,'') + '</code></pre>');
    return '\u0000CODE' + idx + '\u0000';
  });

  // 3. 表格处理（支持 | col1 | col2 | 格式）
  const lines = html.split('\n');
  const outLines = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    // 检测表格: 当前行和下一行都含 |，且下一行是分隔线
    if (line.includes('|') && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1]) && lines[i+1].includes('-')) {
      // 解析表头
      const headers = line.split('|').map(s=>s.trim()).filter(s=>s!=='' || true);
      // 去掉首尾空管道
      let hdrs = line.split('|').map(s=>s.trim());
      if (hdrs[0]==='') hdrs.shift();
      if (hdrs[hdrs.length-1]==='') hdrs.pop();
      i += 2; // 跳过分隔线
      const rows = [];
      while (i < lines.length && lines[i].includes('|')) {
        let cells = lines[i].split('|').map(s=>s.trim());
        if (cells[0]==='') cells.shift();
        if (cells[cells.length-1]==='') cells.pop();
        rows.push(cells);
        i++;
      }
      let table = '<table><thead><tr>' + hdrs.map(h=>'<th>'+h+'</th>').join('') + '</tr></thead><tbody>';
      rows.forEach(r => { table += '<tr>' + r.map(c=>'<td>'+c+'</td>').join('') + '</tr>'; });
      table += '</tbody></table>';
      outLines.push(table);
      continue;
    }
    outLines.push(line);
    i++;
  }
  html = outLines.join('\n');

  // 4. 行内代码
  html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');

  // 5. 粗体/斜体
  html = html.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, '<em>$1</em>');

  // 6. 标题（必须在行首）
  html = html.replace(/^####\s+(.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^##\s+(.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^#\s+(.+)$/gm, '<h1>$1</h1>');

  // 7. 分割线
  html = html.replace(/^---+$/gm, '<hr>');

  // 8. 引用块
  html = html.replace(/^&gt;\s+(.+)$/gm, '<blockquote>$1</blockquote>');

  // 9. 无序列表
  html = html.replace(/^(\s*)[-*]\s+(.+)$/gm, '$1<li>$2</li>');
  html = html.replace(/(<li>[\s\S]*?<\/li>)(?:\n(?=\s*<li>))?/g, m => '<ul>' + m + '</ul>');

  // 10. 有序列表
  html = html.replace(/^(\s*)\d+\.\s+(.+)$/gm, '$1<li>$2</li>');
  // (有序列表的 ul 包裹已在无序列表步骤处理，合并即可)

  // 11. 段落处理：连续非标签文本行用 <p> 包裹
  html = html.split('\n').map(line => {
    if (line.trim() === '') return '';
    if (/^<(h[1-4]|ul|ol|li|pre|blockquote|table|hr|div)/.test(line.trim())) return line;
    if (/^\u0000CODE/.test(line)) return line;
    return '<p>' + line + '</p>';
  }).join('\n');

  // 12. 还原代码块
  html = html.replace(/\u0000CODE(\d+)\u0000/g, (m, idx) => codeBlocks[parseInt(idx)] || '');

  // 13. 清理多余空行
  html = html.replace(/\n{3,}/g, '\n\n');

  return html;
}

// ====== 网络连接地理地图 ======
let _netMapChart = null;
let _worldJsonLoaded = false;
let _homeCoord = [104.0, 35.0]; // 默认中国中心，首次加载数据后自动更新

function _getFlowColor(sent, recv) {
  sent = sent || 0;
  recv = recv || 0;
  if (sent === 0 && recv === 0) return '#8b949e'; // 无数据，灰色
  var ratio = sent / (sent + recv);
  if (ratio > 0.6) return '#f85149'; // 主要外发 → 红色
  if (ratio < 0.4) return '#3fb950'; // 主要接收 → 绿色
  return '#58a6ff'; // 双向流量 → 蓝色
}

function renderNetMap(conns) {
  const chartDom = document.getElementById('net-map-chart');
  if (!chartDom) return;

  // 收集有坐标的公网连接
  const points = [];
  const seenCoords = {};
  (conns || []).forEach(function(c) {
    const lng = c.geo && c.geo.lng;
    const lat = c.geo && c.geo.lat;
    if (lng && lat) {
      // 用第一条有坐标的连接推断本机位置
      if (_homeCoord[0] === 104.0 && _homeCoord[1] === 35.0) {
        _homeCoord = [lng, lat];
      }
      const key = lng + ',' + lat;
      const sent = c.bytes_sent || 0;
      const recv = c.bytes_recv || 0;
      const color = _getFlowColor(sent, recv);
      if (!seenCoords[key]) {
        seenCoords[key] = { sent: 0, recv: 0, count: 0, items: [] };
      }
      seenCoords[key].sent += sent;
      seenCoords[key].recv += recv;
      seenCoords[key].count++;
      seenCoords[key].items.push(c);
    }
  });

  // 按坐标聚合点
  Object.keys(seenCoords).forEach(function(key) {
    const parts = key.split(',');
    const lng = parseFloat(parts[0]);
    const lat = parseFloat(parts[1]);
    const agg = seenCoords[key];
    const color = _getFlowColor(agg.sent, agg.recv);
    const sentStr = _formatBytes(agg.sent);
    const recvStr = _formatBytes(agg.recv);
    // 取第一个连接的信息做展示
    const first = agg.items[0];
    let tooltip = '<div style="font-weight:600;margin-bottom:4px">' + first.geo.geo_str + '</div>';
    tooltip += '<div style="font-size:11px;color:#8b949e">' + agg.count + ' 个连接</div>';
    tooltip += '<div style="font-size:11px">发送: ' + sentStr + ' | 接收: ' + recvStr + '</div>';
    agg.items.slice(0, 5).forEach(function(c) {
      tooltip += '<div style="font-size:11px;color:#8b949e;margin-top:2px">' + c.remote_ip + ':' + c.remote_port + ' | ' + (c.process||'?') + '</div>';
    });
    if (agg.items.length > 5) tooltip += '<div style="font-size:11px;color:#8b949e">...等 ' + agg.items.length + ' 个</div>';

    points.push({
      name: first.geo.geo_str,
      value: [lng, lat, agg.count],
      itemStyle: { color: color, shadowBlur: 6, shadowColor: color },
      tooltipHtml: tooltip
    });
  });

  if (!_netMapChart) {
    _netMapChart = echarts.init(chartDom);
    window.addEventListener('resize', function() { if (_netMapChart) _netMapChart.resize(); });
  }

  if (!_worldJsonLoaded) {
    fetch('/data/world.json').then(function(r) { return r.json(); }).then(function(worldJson) {
      echarts.registerMap('world', worldJson);
      _worldJsonLoaded = true;
      _drawNetMap(points);
    }).catch(function(e) {
      console.error('加载world.json失败:', e);
      _netMapChart.setOption({
        title: { text: '地图加载失败', left:'center', top:'center', textStyle:{color:'#8b949e',fontSize:14} }
      });
    });
  } else {
    _drawNetMap(points);
  }
}

function _drawNetMap(points) {
  const option = {
    backgroundColor: '#0d1117',
    tooltip: {
      trigger: 'item',
      formatter: function(p) {
        if (p.data && p.data.tooltipHtml) return p.data.tooltipHtml;
        return p.name;
      },
      backgroundColor: '#161b22',
      borderColor: '#30363d',
      textStyle: { color: '#c9d1d9', fontSize: 12 },
      extraCssText: 'max-width:320px;'
    },
    geo: {
      map: 'world',
      roam: true,
      silent: false,
      center: _homeCoord,
      zoom: 4,
      itemStyle: { areaColor: '#161b22', borderColor: '#30363d' },
      emphasis: { itemStyle: { areaColor: '#21262d' }, label: { show: false } },
      scaleLimit: { min: 1, max: 15 }
    },
    series: [{
      name: '网络连接',
      type: 'scatter',
      coordinateSystem: 'geo',
      data: points,
      symbolSize: function(val) {
        return Math.min(8 + val[2] * 2, 25);
      },
      label: { show: false },
      emphasis: {
        scale: 1.5,
        label: {
          show: true,
          formatter: function(p) { return p.data.name; },
          position: 'top',
          color: '#58a6ff',
          fontSize: 11,
          backgroundColor: '#161b22',
          borderColor: '#30363d',
          borderWidth: 1,
          padding: [4, 8],
          borderRadius: 4
        }
      }
    }]
  };
  _netMapChart.setOption(option, true);
}

function mapZoomIn() {
  if (!_netMapChart) return;
  var option = _netMapChart.getOption();
  var zoom = (option.geo && option.geo[0] && option.geo[0].zoom) || 4;
  _netMapChart.setOption({ geo: { zoom: Math.min(zoom * 1.3, 15) } });
}

function mapZoomOut() {
  if (!_netMapChart) return;
  var option = _netMapChart.getOption();
  var zoom = (option.geo && option.geo[0] && option.geo[0].zoom) || 4;
  _netMapChart.setOption({ geo: { zoom: Math.max(zoom / 1.3, 1) } });
}

function mapResetCenter() {
  if (!_netMapChart) return;
  _netMapChart.setOption({ geo: { center: _homeCoord, zoom: 4 } });
}

function _formatBytes(bytes) {
  if (!bytes || bytes === 0) return '0 B';
  var units = ['B', 'KB', 'MB', 'GB', 'TB'];
  var i = Math.floor(Math.log(bytes) / Math.log(1024));
  return (bytes / Math.pow(1024, i)).toFixed(1) + ' ' + units[i];
}

// ====== 路由跟踪 ======
async function runTraceroute() {
  const target = document.getElementById('trace-target').value.trim();
  if (!target) return;
  const hops = document.getElementById('trace-hops').value || 30;
  const container = document.getElementById('trace-result');
  container.innerHTML = '<div class="loading">正在执行路由跟踪...</div>';
  try {
    const res = await fetch(API + '/api/traceroute', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({target, hops:parseInt(hops)})
    });
    const data = await res.json();
    if (data.error) { container.innerHTML = `<div class="loading" style="color:#f85149">${data.error}</div>`; return; }
    let html = '<div style="background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px">';
    html += `<div style="margin-bottom:8px;color:#58a6ff">目标: ${data.target} (${data.hops.length}跳)</div>`;
    data.hops.forEach(h => {
      const geo = h.geo ? h.geo.geo_str : '';
      html += `<div class="trace-hop">
        <span class="num">${h.hop}</span>
        <span class="ip">${h.ip}</span>
        <span class="geo">${geo}</span>
        <span class="rtt">${h.rtt_ms ? h.rtt_ms.toFixed(1)+'ms' : '*'}</span>
      </div>`;
    });
    html += '</div>';
    container.innerHTML = html;
  } catch(e) { container.innerHTML = '<div class="loading">跟踪失败: '+e+'</div>'; }
}

    const [procRes, connRes] = await Promise.all([
      fetch(API+'/api/processes?risky=1').then(r=>r.json()),
      fetch(API+'/api/connections?risky=1').then(r=>r.json())
    ]);
    document.getElementById('ai-risky-procs').textContent = procRes.count;
    document.getElementById('ai-risky-conns').textContent = connRes.count;
  } catch(e) { console.error(e); }
}

async function aiAnalyze(type, pid, remotePort) {
  const isModal = type === 'process' || type === 'connection';
  if (isModal) { openModal(); }
  const body = isModal ? document.getElementById('ai-modal-body') : document.getElementById('ai-result-container');
  body.innerHTML = '<div class="loading">正在等待AI分析 (可能需要数十秒)...</div>';
  document.getElementById('ai-modal-title').textContent = type==='process'?`AI 进程分析` : type==='connection'?`AI 连接分析` : 'AI 综合安全报告';

  try {
    let payload = {type};
    if (type === 'process') payload.pid = pid;
    if (type === 'connection') { payload.remote_ip = pid; payload.remote_port = remotePort; }
    const res = await fetch(API + '/api/ai/analyze', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.success) {
      body.innerHTML = `<div class="ai-result">${renderMarkdown(data.analysis)}</div>` +
        (isModal ? `<div style="margin-top:12px;text-align:right"><button class="btn" onclick="closeModal()">关闭</button></div>` : '');
    } else {
      body.innerHTML = `<div class="ai-error">${data.error || '分析失败'}</div>`;
    }
  } catch(e) {
    body.innerHTML = `<div class="ai-error">请求失败: ${e}</div>`;
  }
}

function showAIConfig() {
  openModal();
  document.getElementById('ai-modal-title').textContent = 'AI 配置';
  fetch(API + '/api/ai/config').then(r=>r.json()).then(cfg => {
    document.getElementById('ai-modal-body').innerHTML = `
      <div class="config-form">
        <div><label>端点地址 (endpoint)</label><input id="cfg-endpoint" value="${cfg.endpoint||''}"></div>
        <div><label>TokenHub URL</label><input id="cfg-tokenhub" value="${cfg.tokenhub_url||''}"></div>
        <div><label>模型名称 (model_name)</label><input id="cfg-model-name" value="${cfg.model_name||''}"></div>
        <div><label>模型ID (model_id)</label><input id="cfg-model-id" value="${cfg.model_id||''}"></div>
        <div><label>App ID</label><input id="cfg-app-id" value="${cfg.app_id||''}" placeholder="天翼云应用ID"></div>
        <div><label>App Secret</label><input id="cfg-app-secret" type="password" value="${cfg.app_secret&&cfg.app_secret.startsWith('***')?'':cfg.app_secret||''}" placeholder="天翼云应用密钥"></div>
        <div class="full">
          <label class="switch"><input type="checkbox" id="cfg-enabled" ${cfg.enabled?'checked':''}> 启用AI分析</label>
        </div>
        <div class="full" style="display:flex;gap:8px;margin-top:8px">
          <button class="btn primary" onclick="saveAIConfig()">保存配置</button>
          <button class="btn" onclick="aiTest()">测试连接</button>
          <button class="btn" onclick="closeModal()">关闭</button>
        </div>
      </div>`;
  });
}

async function saveAIConfig() {
  const cfg = {
    endpoint: document.getElementById('cfg-endpoint').value,
    tokenhub_url: document.getElementById('cfg-tokenhub').value,
    model_name: document.getElementById('cfg-model-name').value,
    model_id: document.getElementById('cfg-model-id').value,
    app_id: document.getElementById('cfg-app-id').value,
    app_secret: document.getElementById('cfg-app-secret').value,
    enabled: document.getElementById('cfg-enabled').checked,
  };
  try {
    const res = await fetch(API + '/api/ai/config', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(cfg)
    });
    const data = await res.json();
    if (data.success) { alert('配置已保存'); loadAIStatus(); }
    else alert('保存失败: ' + (data.error||''));
  } catch(e) { alert('保存失败: '+e); }
}

async function aiTest() {
  const body = document.getElementById('ai-modal-body');
  body.innerHTML += '<div class="loading" id="ai-test-loading">测试中...</div>';
  try {
    const res = await fetch(API + '/api/ai/test', {method:'POST'});
    const data = await res.json();
    const el = document.getElementById('ai-test-loading');
    if (data.success) { el.innerHTML = `<span style="color:#3fb950">连接成功: ${data.analysis.substring(0,100)}</span>`; }
    else { el.innerHTML = `<span style="color:#f85149">失败: ${data.error}</span>`; }
  } catch(e) { document.getElementById('ai-test-loading').innerHTML = '<span style="color:#f85149">请求失败</span>'; }
}

function copyKillCmd(pid, name) {
  const cmd = 'sudo kill -9 ' + pid;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(cmd).then(function() {
      showToast('已复制: ' + cmd);
    }).catch(function() {
      _fallbackCopy(cmd);
    });
  } else {
    _fallbackCopy(cmd);
  }
}

function _fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showToast('已复制: ' + text);
  } catch(e) {
    showToast('复制失败，请手动复制: ' + text);
  }
  document.body.removeChild(ta);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function() { t.classList.remove('show'); }, 2500);
}

function openModal() { document.getElementById('ai-modal').classList.add('show'); }
function closeModal() { document.getElementById('ai-modal').classList.remove('show'); }

// ====== 自动刷新 ======
function toggleAutoRefresh(type) {
  const sel = document.getElementById(type + '-auto-refresh');
  const interval = parseInt(sel.value);
  if (refreshTimers[type]) { clearInterval(refreshTimers[type]); refreshTimers[type] = null; }
  if (interval > 0) {
    if (type === 'proc') loadProcesses(); else loadConnections();
    refreshTimers[type] = setInterval(() => {
      if (type === 'proc') loadProcesses(); else loadConnections();
    }, interval * 1000);
  }
}

// 初始化
loadOverview();
setInterval(loadOverview, 10000);
